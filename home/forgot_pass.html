<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Teacher Insight Engine</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style1.css">
</head>
<body class="auth-body">

    <div class="ambient-background">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
    </div>

    <main class="auth-card animate-pop-in">
        <h1 class="auth-title">Reset Password</h1>
        
        <p style="color: var(--text-light); margin-bottom: 25px; line-height: 1.5;">
            Enter the email address associated with your account and we'll send you a link to reset your password.
        </p>

        <form action="login.html">
            <div class="input-group">
                <input type="email" placeholder="Enter your email address" class="input-field" required>
            </div>
            
            <button type="submit" class="btn-auth">Send Reset Link</button>
        </form>

        <div class="auth-footer">
            <a href="login.html" class="auth-link" style="margin-left: 0;">&larr; Back to Login</a>
        </div>
    </main>

</body>
</html>

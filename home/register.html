<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Teacher Insight Engine</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="login&register.css">
</head>
<body class="auth-body">

    <div class="ambient-background">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
    </div>

    <main class="auth-card animate-pop-in">
        <h1 class="auth-title">Create Account</h1>
        
        <form action="login.html">
            <div class="input-group">
                <input type="text" placeholder="Full Name" class="input-field" required>
            </div>

            <div class="input-group">
                <input type="email" placeholder="Email Address" class="input-field" required>
            </div>
            
            <div class="register-grid">
                <div class="input-group">
                    <input type="password" placeholder="Password" class="input-field" required>
                </div>
                <div class="input-group">
                    <input type="password" placeholder="Confirm Password" class="input-field" required>
                </div>
            </div>
            
            <button type="submit" class="btn-auth" style="margin-top: 10px;">Register</button>
        </form>

        <div class="auth-footer">
            <p>Already have an account? <a href="login.html" class="auth-link">Login</a></p>
        </div>
    </main>

</body>
</html>

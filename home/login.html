<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Teacher Insight Engine</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="login&register.css">
</head>
<body class="auth-body">

    <div class="ambient-background">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
    </div>

    <main class="auth-card animate-pop-in">
        <h1 class="auth-title">Teacher Performance Analytics Login</h1>
        
        <form action="index.html">
            <div class="input-group">
                <input type="text" placeholder="Username" class="input-field" required>
            </div>
            
            <div class="input-group">
                <input type="password" placeholder="Password" class="input-field" required>
            </div>
            
            <div class="form-actions">
                <label class="checkbox-container">
                    <input type="checkbox"> Remember me
                </label>
                <a href="forgot_pass.html" class="forgot-link">Forgot Password?</a>
            </div>
            
            <button type="submit" class="btn-auth">Login</button>
        </form>

        <div class="auth-footer">
            <p>Don't have an account? <a href="register.html" class="auth-link">Sign up</a></p>
        </div>
    </main>

</body>
</html>
